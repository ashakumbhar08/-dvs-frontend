name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  frontend-build:
    name: Frontend Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Build frontend
        run: npm run build
        env:
          CI: true

      - name: Check build output
        run: |
          echo "✅ Frontend build completed successfully"
          echo ""
          echo "📦 Build artifacts:"
          ls -lh dist/
          echo ""
          echo "📊 Build size:"
          du -sh dist/

      - name: Upload frontend artifacts
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: dist/
          retention-days: 7

  contract-build:
    name: Smart Contract Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            contracts/target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Verify Rust installation
        run: |
          echo "🦀 Rust toolchain information:"
          rustc --version
          cargo --version
          echo ""
          echo "📦 Installed targets:"
          rustup target list --installed

      - name: Build certificate contract
        working-directory: contracts
        run: |
          echo "🔨 Building certificate_contract..."
          cargo build --package certificate_contract --target wasm32-unknown-unknown --release
          echo "✅ Certificate contract built successfully"

      - name: Build reward contract
        working-directory: contracts
        run: |
          echo "🔨 Building reward_contract..."
          cargo build --package reward_contract --target wasm32-unknown-unknown --release
          echo "✅ Reward contract built successfully"

      - name: Verify contract outputs
        working-directory: contracts
        run: |
          echo "✅ Smart contract build verification"
          echo ""
          echo "📦 Contract WASM files:"
          ls -lh target/wasm32-unknown-unknown/release/*.wasm
          echo ""
          echo "📊 Contract sizes:"
          du -h target/wasm32-unknown-unknown/release/*.wasm
          echo ""
          echo "✅ All contracts built successfully"

      - name: Upload contract artifacts
        uses: actions/upload-artifact@v4
        with:
          name: contract-wasm
          path: |
            contracts/target/wasm32-unknown-unknown/release/certificate_contract.wasm
            contracts/target/wasm32-unknown-unknown/release/reward_contract.wasm
          retention-days: 30

  integration-check:
    name: Integration Verification
    runs-on: ubuntu-latest
    needs: [frontend-build, contract-build]

    steps:
      - name: Download frontend artifacts
        uses: actions/download-artifact@v4
        with:
          name: frontend-build
          path: frontend-dist/

      - name: Download contract artifacts
        uses: actions/download-artifact@v4
        with:
          name: contract-wasm
          path: contracts-wasm/

      - name: Verify all artifacts
        run: |
          echo "🔍 Integration Verification"
          echo "============================"
          echo ""
          echo "✅ Frontend artifacts:"
          ls -lh frontend-dist/ | head -10
          echo ""
          echo "✅ Contract artifacts:"
          ls -lh contracts-wasm/
          echo ""
          echo "📊 Summary:"
          echo "  - Frontend build: $(du -sh frontend-dist/ | cut -f1)"
          echo "  - Certificate contract: $(du -h contracts-wasm/certificate_contract.wasm | cut -f1)"
          echo "  - Reward contract: $(du -h contracts-wasm/reward_contract.wasm | cut -f1)"
          echo ""
          echo "✅ All components built successfully"

  deployment-ready:
    name: Deployment Ready
    runs-on: ubuntu-latest
    needs: [frontend-build, contract-build, integration-check]
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Deployment status
        run: |
          echo "🚀 Deployment Status"
          echo "===================="
          echo ""
          echo "✅ Frontend CI passed"
          echo "✅ Smart contracts validated"
          echo "✅ Integration check passed"
          echo "✅ Ready for deployment"
          echo ""
          echo "📦 Frontend: Vercel will automatically deploy"
          echo "🔗 Live URL: https://dvs-frontend-wine.vercel.app"
          echo ""
          echo "📦 Contracts: Ready for Stellar Testnet deployment"
          echo "   Use: soroban contract deploy --wasm <contract>.wasm"
